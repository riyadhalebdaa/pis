<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Display</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Tajawal للأرقام فقط: الطلب يحمّل شكل الأرقام (٠-٩ و 0-9 والنقطتين وعلامة ٪) دون بقية الحروف -->
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&amp;text=0123456789%D9%A0%D9%A1%D9%A2%D9%A3%D9%A4%D9%A5%D9%A6%D9%A7%D9%A8%D9%A9%3A%D9%AA%25&amp;display=swap"
      rel="stylesheet"
    />

    <style>
      /* ========================================================
         DESIGN TOKENS — غيّر القيم من هنا فقط
         ======================================================== */
      :root {
        /* هوية المدرسة */
        --maroon: #5d0413;
        --maroon-deep: #2a0209;
        --coral: #d04931;
        --gold: #f2b134;

        /* نصوص */
        --ink: #1a0b0e;
        --ink-soft: #6b5a5e;

        /* حالات */
        --ok-1: #00c853;
        --ok-2: #4ae59a;
        --danger: #f34141;

        /* الزجاج — اجعل --glass-blur: 0px لتخفيف الحمل على الأجهزة الضعيفة */
        --glass-blur: 18px;

        /* مقاسات (كلها بوحدة rem وتتناسب مع حجم الشاشة تلقائياً) */
        --edge: 2.5rem;
        --radius-xl: 2rem;
        --radius-lg: 1.6rem;
        --clock: 16rem;

        /* Tajawal يحتوي الأرقام فقط (انظر وسم الخط أعلاه)، فتظهر كل الأرقام به وبقية النص بـ IBM Plex */
        --font: "Tajawal", "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
        --clock-ink: #2b2c2b;
      }

      /* 1rem = 16px على شاشة 1920×1080، ويتكبّر/يصغّر مع الشاشة بنفس النسبة */
      html {
        font-size: 16px;
        font-size: clamp(7px, min(0.8333vw, 1.4815vh), 48px);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
      }

      body {
        font-family: var(--font);
        background: #000;
        overflow: hidden;
        visibility: visible;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      /* ========================================================
         GLASS SURFACE
         ======================================================== */
      .glass {
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.84), rgba(255, 255, 255, 0.64));
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(170%);
        backdrop-filter: blur(var(--glass-blur)) saturate(170%);
        border: 1px solid rgba(255, 255, 255, 0.7);
        box-shadow:
          0 1.1rem 2.8rem rgba(30, 0, 10, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
      }
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        .glass {
          background: rgba(255, 255, 255, 0.95);
        }
      }

      /* ظهور عناصر الواجهة بعد انتهاء التحميل */
      .ui-item {
        transition:
          opacity 0.9s ease calc(var(--i, 0) * 0.14s),
          transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) calc(var(--i, 0) * 0.14s);
      }
      .booting .ui-item {
        opacity: 0;
        transform: translateY(1.5rem);
      }

      /* ========================================================
         LOADING
         ======================================================== */
      #loadingScreen {
        position: fixed;
        inset: 0;
        background:
          radial-gradient(60% 55% at 50% 38%, rgba(208, 73, 49, 0.28), transparent 70%),
          radial-gradient(90% 80% at 50% 100%, rgba(93, 4, 19, 0.75), transparent 70%),
          #0b0204;
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9000;
        direction: rtl;
        transition: opacity 0.8s ease;
      }
      .loader-mark {
        position: relative;
        width: 9rem;
        height: 9rem;
        display: grid;
        place-items: center;
      }
      .loader-mark img {
        width: 4.6rem;
        height: auto;
        position: relative;
        z-index: 1;
      }
      .loader-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(from 0deg, rgba(242, 177, 52, 0) 0%, var(--gold) 100%);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 0.35rem), #000 calc(100% - 0.3rem));
        mask: radial-gradient(farthest-side, transparent calc(100% - 0.35rem), #000 calc(100% - 0.3rem));
        animation: spin 1.5s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loader-title {
        margin-top: 2.2rem;
        font-size: 1.9rem;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #progressContainer {
        width: 26rem;
        max-width: calc(100vw - 40px);
        height: 0.7rem;
        background: rgba(255, 255, 255, 0.14);
        margin-top: 1.8rem;
        border-radius: 1rem;
        overflow: hidden;
      }
      #progressBar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--ok-1), var(--ok-2));
        border-radius: inherit;
        transition: width 0.3s ease;
      }
      #progressText {
        margin-top: 1rem;
        font-size: 1.35rem;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.85);
        text-align: center;
        max-width: calc(100vw - 32px);
      }

      /* ========================================================
         MEDIA LAYERS
         ======================================================== */
      #bgVideo {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 2000;
        opacity: 0;
        transition: opacity 1.2s ease;
        display: none;
      }

      .slider {
        position: fixed;
        width: 100%;
        height: 100%;
        z-index: 1000;
        opacity: 1;
        transition: opacity 1.2s ease;
      }
      .slide {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 1.5s ease-in-out;
      }
      .slide.active {
        opacity: 1;
      }

      /* ========================================================
         BRAND (LOGO)
         ======================================================== */
      .top-right-logo {
        position: absolute;
        top: 0;
        right: 0;
        width: clamp(250px, 11vw, 839px);
        max-width: 45vw;
        min-width: 0;
        height: auto;
        z-index: 5000;
      }

      /* ========================================================
         ANALOG CLOCK
         ======================================================== */
      .clock {
        position: absolute;
        top: var(--edge);
        left: var(--edge);
        width: var(--clock);
        height: var(--clock);
        border-radius: 50%;
        background:
          radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.62) 70%);
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(160%);
        backdrop-filter: blur(var(--glass-blur)) saturate(160%);
        box-shadow:
          0 0 0 0.38rem var(--clock-ink),
          0 0 0 0.62rem rgba(255, 255, 255, 0.6),
          0 1.4rem 3.2rem rgba(30, 0, 10, 0.38),
          inset 0 0 2rem rgba(93, 4, 19, 0.12);
        z-index: 5000;
      }
      .center {
        position: absolute;
        left: 50%;
        top: 50%;
        width: calc(var(--clock) * 0.06);
        height: calc(var(--clock) * 0.06);
        margin: calc(var(--clock) * -0.03) 0 0 calc(var(--clock) * -0.03);
        background: var(--danger);
        border: calc(var(--clock) * 0.012) solid var(--maroon-deep);
        border-radius: 50%;
        z-index: 10;
      }
      .clock-logo {
        position: absolute;
        width: 20%;
        z-index: 2;
        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .hand {
        position: absolute;
        bottom: 50%;
        left: 50%;
        width: var(--w);
        margin-left: calc(var(--w) / -2);
        transform-origin: 50% 100%;
        border-radius: 1rem;
        z-index: 5;
      }
      .hour {
        --w: calc(var(--clock) * 0.034);
        height: 26%;
        background: var(--maroon-deep);
        box-shadow: 0 0.15rem 0.4rem rgba(0, 0, 0, 0.3);
        z-index: 7;
      }
      .minute {
        --w: calc(var(--clock) * 0.022);
        height: 38%;
        background: var(--maroon);
        box-shadow: 0 0.15rem 0.4rem rgba(0, 0, 0, 0.25);
        z-index: 8; /* فوق الأرقام (z-index: 6) */
      }
      .second {
        --w: calc(var(--clock) * 0.01);
        height: 43%;
        background: var(--danger);
        z-index: 9;
      }
      .second::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 0;
        width: 100%;
        height: 16%;
        background: inherit;
        border-radius: inherit;
      }
      .number {
        position: absolute;
        font-size: calc(var(--clock) * 0.085);
        font-weight: 500;
        color: var(--clock-ink);
        transform: translate(-50%, -50%);
        z-index: 6;
        line-height: 1;
      }
      .number.bold {
        font-weight: 700;
        font-size: calc(var(--clock) * 0.11);
        color: var(--clock-ink);
      }
      .tick {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      .tick::before {
        content: "";
        position: absolute;
        top: 2.2%;
        left: 50%;
        width: calc(var(--clock) * 0.012);
        height: 4.5%;
        margin-left: calc(var(--clock) * -0.006);
        background: var(--clock-ink);
        border-radius: 1rem;
      }
      .tick.small::before {
        width: calc(var(--clock) * 0.007);
        height: 2.2%;
        margin-left: calc(var(--clock) * -0.0035);
        background: rgba(26, 11, 14, 0.4);
      }

      /* ========================================================
         STATUS CARDS
         ======================================================== */
      .status-container {
        position: absolute;
        bottom: var(--edge);
        right: var(--edge);
        display: flex;
        gap: 1.25rem;
        z-index: 5000;
        direction: rtl;
      }

      .status {
        display: none;
        width: 21rem;
        padding: 1.25rem 1.5rem 1.4rem;
        border-radius: var(--radius-xl);
        text-align: right;
        --accent: var(--maroon);
        animation: popIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes popIn {
        from { opacity: 0; transform: translateY(1rem) scale(0.97); }
        to { opacity: 1; transform: none; }
      }

      .status-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 1rem 0.35rem 1.1rem;
        border-radius: 99rem;
        background: var(--accent);
        color: #fff;
        font-size: 1.05rem;
        font-weight: 700;
      }
      .status-icon {
        font-size: 0.95rem;
        line-height: 1;
      }

      .status-now {
        margin-top: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.1rem;
      }
      .status-now-label {
        font-size: 1rem;
        font-weight: 500;
        color: var(--ink-soft);
      }
      .status-name {
        font-size: 1.95rem;
        font-weight: 700;
        line-height: 1.3;
        color: var(--ink);
      }

      .status.is-exit .status-name {
        font-size: 2.3rem;
        color: var(--accent);
      }

      .time-row {
        margin-top: 1.1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.8rem;
        direction: rtl;
      }
      .time-text {
        font-size: 1.7rem;
        font-weight: 600;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      .progress-track {
        flex: 1;
        height: 0.65rem;
        background: rgba(26, 11, 14, 0.12);
        border-radius: 1rem;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--ok-1), var(--ok-2));
        border-radius: inherit;
        transition: width 1s linear, background 0.3s;
      }
      .progress-fill.ending {
        background: var(--danger);
        animation: pulseBar 1s infinite;
      }
      @keyframes pulseBar {
        0% { opacity: 1; }
        50% { opacity: 0.55; }
        100% { opacity: 1; }
      }

      .remaining {
        margin-top: 0.9rem;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0.1rem 0.5rem;
        font-size: 1.12rem;
        line-height: 1.5;
      }
      .remaining strong {
        font-weight: 700;
        color: var(--ink);
      }
      .remaining span {
        font-weight: 500;
        color: var(--ink);
      }

      /* ========================================================
         DATE + DIGITAL TIME
         ======================================================== */
      .date-box {
        position: absolute;
        bottom: var(--edge);
        left: var(--edge);
        min-width: 19rem;
        padding: 1.2rem 1.8rem;
        border-radius: var(--radius-xl);
        direction: rtl;
        text-align: right;
        z-index: 5000;
      }
      .date-text {
        font-size: 1.55rem;
        font-weight: 500;
        line-height: 1.5;
        color: var(--ink);
      }
      .date-text b {
        font-weight: 700;
        color: var(--maroon);
      }
      .date-text .date-greg {
        margin-top: 0.15rem;
        color: var(--ink-soft);
        font-size: 1.27rem;
      }

      /* ========================================================
         OVERLAY ALERT
         ======================================================== */
      .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 3rem;
        color: #fff;
        text-align: center;
        background:
          radial-gradient(120% 90% at 50% 0%, rgba(120, 8, 30, 0.6), rgba(8, 1, 3, 0.9));
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.6s ease, visibility 0s linear 0.6s;
        z-index: 6000;
        direction: rtl;
      }
      .overlay.show {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.6s ease, visibility 0s linear 0s;
      }
      .overlay-card {
        position: relative;
        width: 100%;
        max-width: 78rem;
        padding: 4rem 4.5rem 5rem;
        border-radius: 3rem;
        background: linear-gradient(160deg, rgba(255, 255, 255, 0.15), rgba(255, 255, 255, 0.05));
        border: 1px solid rgba(255, 255, 255, 0.26);
        box-shadow:
          0 2.5rem 6rem rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.32);
        animation: cardIn 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes cardIn {
        from { opacity: 0; transform: translateY(1.5rem) scale(0.95); }
        to { opacity: 1; transform: none; }
      }
      .overlay-text {
        font-size: 3.1rem;
        font-weight: 700;
        line-height: 1.85;
        text-shadow: 0 0.2rem 1rem rgba(0, 0, 0, 0.45);
      }
      .overlay-timer {
        position: absolute;
        left: 4.5rem;
        right: 4.5rem;
        bottom: 2.2rem;
        height: 0.5rem;
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.18);
        overflow: hidden;
      }
      .overlay-timer i {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--gold), #ffd86b);
        transform-origin: right center;
        animation: timerShrink linear forwards;
      }
@keyframes timerShrink {
  from { transform: scaleX(0); }
  to { transform: scaleX(1); }
}

      /* ========================================================
         ATHAN
         ======================================================== */
      #athanVideo {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 4000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 1.5s ease, visibility 0s linear 1.5s;
      }
      #athanVideo.show {
        opacity: 1;
        visibility: visible;
        transition: opacity 1.5s ease, visibility 0s linear 0s;
      }
      #athanWhiteFade {
        position: fixed;
        inset: 0;
        background: white;
        opacity: 0;
        pointer-events: none;
        z-index: 9998;
        transition: opacity 2.5s ease;
      }

      /* ========================================================
         PORTRAIT / TALL SCREENS
         ======================================================== */
      @media (max-aspect-ratio: 9/10) {
        html {
          font-size: clamp(7px, 1.5vw, 40px);
        }
        .status-container {
          flex-direction: column;
          gap: 1rem;
        }
        .status {
          width: 19rem;
        }
        .date-box {
          min-width: 16rem;
        }
      }
    </style>
  </head>
  <body class="booting">
    <video id="bgVideo" muted loop playsinline>
      <source src="video/rc.mp4" type="video/mp4" />
    </video>

    <div id="loadingScreen">
      <div class="loader-mark">
        <div class="loader-ring"></div>
        <img src="logo_without_texts.png" alt="" aria-hidden="true" />
      </div>
      <div class="loader-title">جاري تحميل النظام...</div>
      <div id="progressContainer"><div id="progressBar"></div></div>
      <div id="progressText">0%</div>
    </div>

    <div class="slider" id="slider"></div>

    <img src="reslogo.png" class="top-right-logo ui-item" style="--i: 0" alt="شعار المدرسة" />

    <div class="clock ui-item" style="--i: 1">
      <img src="logo_without_texts.png" class="clock-logo" alt="" aria-hidden="true" />
      <div class="hand hour"></div>
      <div class="hand minute"></div>
      <div class="hand second"></div>
      <div class="center"></div>
    </div>

    <div class="status-container ui-item" style="--i: 3">
      <div class="status glass" id="statusBoxPrimary"></div>
      <div class="status glass" id="statusBoxUpper"></div>
    </div>

    <div class="date-box glass ui-item" id="dateBox" style="--i: 2">
      <div class="date-text" id="dateText"></div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div id="athanWhiteFade"></div>

    <video id="athanVideo" playsinline></video>
    <audio id="athanAudio" src="audio/athan.MP3"></audio>

    <script>
      /* ========================================================
         CONFIGURATION
         ======================================================== */
      const ENABLE_NIGHT_MODE = false;

      /* ========================================================
         SETUP: SOUNDS & DOM ELEMENTS
         ======================================================== */
      const audioFiles = {};
      for (let i = 0; i <= 13; i++) {
        let key = i < 10 ? "0" + i : i.toString();
        audioFiles[key] = new Audio(`audio/${key}.MP3`);
        audioFiles[key].preload = "auto";
      }

      const dateText = document.getElementById("dateText");
      const statusBoxPrimary = document.getElementById("statusBoxPrimary");
      const statusBoxUpper = document.getElementById("statusBoxUpper");
      const overlay = document.getElementById("overlay");
      const bgVideo = document.getElementById("bgVideo");
      const athanVideo = document.getElementById("athanVideo");
      const athanAudio = document.getElementById("athanAudio");
      const slider = document.getElementById("slider");

      // Clock Elements
      const hourEl = document.querySelector(".hour");
      const minuteEl = document.querySelector(".minute");
      const secondEl = document.querySelector(".second");
      const clockEl = document.querySelector(".clock");

      /* Draw Clock Face (المواضع بالنسبة المئوية فتتكيف مع أي حجم) */
      const nums = ["١", "٢", "٣", "٤", "٥", "٦", "٧", "٨", "٩", "١٠", "١١", "١٢"];
      for (let i = 1; i <= 12; i++) {
        let n = document.createElement("div");
        n.className = "number";
        if ([3, 6, 9, 12].includes(i)) n.classList.add("bold");
        n.textContent = nums[i - 1];
        let angle = (i * 30 * Math.PI) / 180;
        let r = 37.5; // نصف القطر كنسبة مئوية من حجم الساعة
        n.style.left = (50 + r * Math.sin(angle)).toFixed(2) + "%";
        n.style.top = (50 - r * Math.cos(angle)).toFixed(2) + "%";
        clockEl.appendChild(n);
      }
      for (let i = 0; i < 60; i++) {
        let t = document.createElement("div");
        t.className = "tick" + (i % 5 ? " small" : "");
        t.style.transform = `rotate(${i * 6}deg)`;
        clockEl.appendChild(t);
      }

      /* ========================================================
         SLIDER SETUP
         ======================================================== */
      const totalImages = 325;
      let currentIndex = 1;
      let img1 = document.createElement("img");
      let img2 = document.createElement("img");

      img1.className = "slide active";
      img2.className = "slide";
      slider.appendChild(img1);
      slider.appendChild(img2);

      function getImagePath(index) {
        return `preimg/Slide${index}.JPG`;
      }
      img1.src = getImagePath(currentIndex);

      let slideInProgress = false;

      function nextSlide() {
        if (slideInProgress || athanActive || bgVideo.style.display === "block") return;

        let nextIndex = currentIndex + 1;
        if (nextIndex > totalImages) nextIndex = 1;

        const targetImage = img2;
        slideInProgress = true;
        targetImage.onload = () => {
          targetImage.onload = null;
          targetImage.onerror = null;
          targetImage.classList.add("active");
          img1.classList.remove("active");
          [img1, img2] = [img2, img1];
          currentIndex = nextIndex;
          slideInProgress = false;
        };
        targetImage.onerror = () => {
          targetImage.onload = null;
          targetImage.onerror = null;
          currentIndex = nextIndex; // تجاوز الصورة المتعذرة بدل التوقف عندها
          slideInProgress = false;
          console.warn(`تعذر تحميل الشريحة: ${getImagePath(nextIndex)}`);
        };
        targetImage.src = getImagePath(nextIndex);
      }

      img1.onerror = () => {

      function toMin(t) {

      function toArabicDigits(s) {
        return s.replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);

        return num.toString().replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
      }

      function getLocalDateKey(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, "0");
        const d = String(date.getDate()).padStart(2, "0");
        return `${y}-${m}-${d}`;
      }
      function formatTimeWithoutLeadingZero(timeStr) {
        let [h, m] = timeStr.split(":");
        h = parseInt(h, 10);
        return h + ":" + m;
      }
      function formatRemainingMinutes(n) {
        if (n === 1) return "متبقي دقيقة";
        if (n === 2) return "متبقي دقيقتان";
        if (n >= 3 && n <= 10) return `متبقي ${toArabicNumber(n)} دقائق`;
        return `متبقي ${toArabicNumber(n)} دقيقة`;
      }

      /* يبني بطاقة الحالة مرة واحدة عند تغيّر الحصة، ثم يحدّث الشريط والنصوص فقط كل ثانية */
      function renderStatusBox(boxElement, eventData, title, titleColor, icon, currentMinutes, schedule = [], exactMinutes = currentMinutes) {
        if (!eventData) {
          boxElement.style.display = "none";
          boxElement.dataset.key = "";
          return;
        }

        boxElement.style.display = "block";
        boxElement.style.setProperty("--accent", titleColor);

        // الاستثناء الأصلي للخروج: بدون مواعيد أو شريط تقدم
        const isExit = eventData.name === "الخروج";
        const key = `${title}|${eventData.name}|${eventData.start}`;

        if (boxElement.dataset.key !== key) {
          boxElement.dataset.key = key;
          boxElement.classList.toggle("is-exit", isExit);

          const head = `
            <div class="status-head">
              <span class="status-chip"><span class="status-icon">${icon}</span>${title}</span>
            </div>
            <div class="status-now">
              <span class="status-now-label">الآن</span>
              <span class="status-name">${eventData.name}</span>
            </div>`;

          if (isExit) {
            boxElement.innerHTML = head;
          } else {
            boxElement.innerHTML = `${head}
              <div class="time-row">
                <span class="time-text">${toArabicNumber(formatTimeWithoutLeadingZero(eventData.start))}</span>
                <div class="progress-track"><div class="progress-fill" data-role="fill"></div></div>
                <span class="time-text">${toArabicNumber(formatTimeWithoutLeadingZero(eventData.end))}</span>
              </div>
              <div class="remaining">
                <strong data-role="remain"></strong>
                <span data-role="next"></span>
              </div>`;
          }
        }

        if (isExit) return;

        const startMin = toMin(eventData.start);
        const endMin = toMin(eventData.end);
        const totalDuration = endMin - startMin;
        const remaining = endMin - currentMinutes;

        const percent = Math.max(0, Math.min(((exactMinutes - startMin) / totalDuration) * 100, 100));
        const isEndingSoon = remaining <= 5;

        // تحديد المدخل التالي مباشرة من الجدول نفسه دون تجاوز أي مدخل
        const idx = schedule.indexOf(eventData);
        const nextEvent = schedule[idx + 1];

        const fill = boxElement.querySelector('[data-role="fill"]');
        const remainEl = boxElement.querySelector('[data-role="remain"]');
        const nextEl = boxElement.querySelector('[data-role="next"]');

        fill.style.width = `${percent}%`;
        fill.classList.toggle("ending", isEndingSoon);
        remainEl.textContent = formatRemainingMinutes(remaining);
        nextEl.textContent = nextEvent ? `على ${nextEvent.name}` : "";
      }

      function checkStatusBoxes(now) {
        let currentMinutes = now.getHours() * 60 + now.getMinutes();
        let exactMinutes = currentMinutes + now.getSeconds() / 60;
        let today = now.getDay();

        // تعطيل صناديق الحالة يومي الجمعة والسبت
        if (today === 5 || today === 6) {
          statusBoxPrimary.style.display = "none";
          statusBoxUpper.style.display = "none";
          statusBoxPrimary.dataset.key = "";
          statusBoxUpper.dataset.key = "";
          return;
        }

        // Days: 0=Sun, 1=Mon, 2=Tue, 3=Wed, 4=Thu
        let isWedThu = (today === 3 || today === 4);
        let currentPrimarySched = isWedThu ? schedPrimaryWedThu : schedPrimaryReg;
        let currentUpperSched = isWedThu ? schedUpperWedThu : schedUpperReg;

        let currentPrimary = currentPrimarySched.find((e) => currentMinutes >= toMin(e.start) && currentMinutes < toMin(e.end));
        let currentUpper = currentUpperSched.find((e) => currentMinutes >= toMin(e.start) && currentMinutes < toMin(e.end));

        renderStatusBox(statusBoxPrimary, currentPrimary, "الصفوف الأولية", "#5d0413", "🟠", currentMinutes, currentPrimarySched, exactMinutes);
        renderStatusBox(statusBoxUpper, currentUpper, "الصفوف العليا", "#d04931", "🟡", currentMinutes, currentUpperSched, exactMinutes);
      }

      function checkAlerts(now) {
        if (athanActive) return;

        const todayKey = getLocalDateKey(now);
        if (triggeredAlertDay !== todayKey) {
          triggeredAlertKeys.clear();
          triggeredAlertDay = todayKey;
        }

        const today = now.getDay();
        const blockedDays = [5, 6]; // الجمعة والسبت
        if (blockedDays.includes(today)) {
          if (alertTimeout) {
            clearTimeout(alertTimeout);
            alertTimeout = null;
          }
          overlay.classList.remove("show");
          Object.values(audioFiles).forEach((sound) => {
            sound.pause();
            sound.currentTime = 0;
          });
          return;
        }

        const isWedThu = today === 3 || today === 4;
        const activeAlerts = isWedThu ? alertsWedThu : alertsSunTue;
        const nowSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        const scheduleKey = isWedThu ? "wt" : "st";

        activeAlerts.forEach((alert, index) => {
          const targetSeconds = toMin(alert.time) * 60;
          const lateness = nowSeconds - targetSeconds;
          // يسمح بهامش قصير لمعالجة تأخر مؤقت المتصفح، دون تشغيل إعلان قديم بعد وقت طويل.
          if (lateness >= 0 && lateness < 15) {
            const alertId = `${todayKey}-${scheduleKey}-${index}`;
            if (!triggeredAlertKeys.has(alertId)) {
              triggeredAlertKeys.add(alertId);
              showOverlayAlert(alert);
            }
          }
        });
      }

      function showOverlayAlert(alert) {
        overlay.innerHTML = `
          <div class="overlay-card">

            <div class="overlay-timer"><i style="animation-duration:${alert.duration}s"></i></div>
          </div>`;
        overlay.classList.add("show");

        const sound = audioFiles[alert.audio];
        Object.values(audioFiles).forEach((otherSound) => {
          if (otherSound !== sound) {
            otherSound.pause();
            otherSound.currentTime = 0;
          }
        });

        if (sound) {
          sound.currentTime = 0;
          sound.play().catch((error) => {
            console.warn(`تعذر تشغيل صوت التنبيه ${alert.audio}:`, error);
          });

        if (alertTimeout) clearTimeout(alertTimeout);
        alertTimeout = setTimeout(() => {

          alertTimeout = null;
        }, alert.duration * 1000);

      function controlNightMode(now) {
        if (!ENABLE_NIGHT_MODE || athanActive) return;

        const minutes = now.getHours() * 60 + now.getMinutes();
        const start = 21 * 60 + 20;
        const end = 24 * 60;
        const shouldShowNightVideo = minutes >= start && minutes < end;

        if (shouldShowNightVideo) {
          if (bgVideo.style.display !== "block") {
            bgVideo.style.display = "block";

            bgVideo.play().catch((error) => {

            requestAnimationFrame(() => { bgVideo.style.opacity = "1"; });

          slider.style.opacity = "0";
          if (slider.style.display !== "none") {
            setTimeout(() => {

        } else {

            setTimeout(() => {

            slider.style.display = "block";
            slider.style.opacity = "1";
          }
        }
      }

      /* ========================================================

         ======================================================== */
      async function fetchPrayerTimes() {
        if (prayerFetchInProgress) return;
        const requestDate = new Date();
        const requestDateKey = getLocalDateKey(requestDate);
        prayerFetchInProgress = true;
        lastPrayerFetchAttempt = Date.now();

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 12000);

        try {
          // واجهة AlAdhan تتطلب الشهر من 1 إلى 12، وليس من 0 إلى 11.
          const day = requestDate.getDate();
          const month = requestDate.getMonth() + 1;
          const year = requestDate.getFullYear();
          const url = `https://api.aladhan.com/v1/timings/${day}-${month}-${year}?latitude=25.9047&longitude=45.3566&method=4`;
          const response = await fetch(url, { signal: controller.signal, cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const data = await response.json();
          const timings = data && data.data && data.data.timings;
          if (data.code !== 200 || !timings) throw new Error("استجابة أوقات الصلاة غير مكتملة");

          function timeToSeconds(value) {
            const match = String(value).match(/^(\d{1,2}):(\d{2})/);
            if (!match) throw new Error(`صيغة وقت غير صحيحة: ${value}`);
            const hour = Number(match[1]);
            const minute = Number(match[2]);
            if (hour > 23 || minute > 59) throw new Error(`وقت خارج النطاق: ${value}`);
            return hour * 3600 + minute * 60;
          }

          const nextPrayerTimes = {
            Fajr: timeToSeconds(timings.Fajr),
            Dhuhr: timeToSeconds(timings.Dhuhr),
            Asr: timeToSeconds(timings.Asr),
            Maghrib: timeToSeconds(timings.Maghrib),
            Isha: timeToSeconds(timings.Isha),
          };

          // لا نستخدم نتائج اليوم السابق إذا تغيّر التاريخ أثناء انتظار الشبكة.
          if (getLocalDateKey(new Date()) === requestDateKey) {
            prayerTimes = nextPrayerTimes;
            prayerTimesDate = requestDateKey;
          }
        } catch (error) {
          console.warn("تعذر تحديث أوقات الصلاة؛ ستتم إعادة المحاولة لاحقًا:", error);
        } finally {
          clearTimeout(timeoutId);
          prayerFetchInProgress = false;
        }
      }

        athanVideo.onended = null;
        athanAudio.onerror = null;
        athanAudio.onended = null;

        let videoFailed = false;
        let audioFailed = false;

        const finishAthan = () => {
          if (thisRun !== athanRunId || athanFinishingRun === thisRun) return;
          athanFinishingRun = thisRun;
          if (athanFinishTimer) {
            clearTimeout(athanFinishTimer);
            athanFinishTimer = null;
          }

          athanVideo.classList.remove("show");
          athanAudio.pause();
          athanAudio.currentTime = 0;
          slider.style.display = "block";

          setTimeout(() => {
            if (thisRun !== athanRunId) return;
            athanVideo.pause();
            athanActive = false;
            const now = new Date();
            const minutes = now.getHours() * 60 + now.getMinutes();
            if (ENABLE_NIGHT_MODE && minutes >= 21 * 60 + 20) {
              bgVideo.style.display = "block";
              bgVideo.style.opacity = "1";
              slider.style.opacity = "0";
              bgVideo.play().catch((error) => console.warn("تعذر استئناف فيديو الليل:", error));
            } else {
              bgVideo.pause();
              bgVideo.style.display = "none";
              bgVideo.style.opacity = "0";
              slider.style.opacity = "1";
            }
          }, 1500);
        };

        athanVideo.onloadeddata = () => {
          if (thisRun !== athanRunId) return;
          athanVideo.classList.add("show");
          athanVideo.play().catch((error) => {
            console.warn(`تعذر تشغيل فيديو الأذان ${prayerName}:`, error);
            videoFailed = true;
            athanVideo.classList.remove("show");
            if (audioFailed) finishAthan();
          });
        };

        athanVideo.onerror = () => {
          if (thisRun !== athanRunId) return;
          videoFailed = true;
          athanVideo.classList.remove("show");
          console.warn(`تعذر تحميل فيديو الأذان: ${videoPath}`);
          if (audioFailed) finishAthan();
        };
        athanVideo.onended = finishAthan;

        athanAudio.onended = finishAthan;
        athanAudio.onerror = () => {
          if (thisRun !== athanRunId) return;
          audioFailed = true;
          console.warn("تعذر تحميل أو تشغيل ملف صوت الأذان audio/athan.MP3");
          if (videoFailed) finishAthan();
        };

        athanAudio.currentTime = 0;
        athanAudio.play().catch((error) => {
          console.warn("تعذر بدء صوت الأذان:", error);
          audioFailed = true;
          if (videoFailed) finishAthan();
        });

        athanVideo.src = videoPath;
        athanVideo.load();

        // حماية أخيرة من بقاء النظام في حالة الأذان إذا لم يصل حدث ended لأي سبب.
        athanFinishTimer = setTimeout(finishAthan, 40000);
      }

      function checkAthanOnline(now) {
        const todayKey = getLocalDateKey(now);
        if (
          prayerTimesDate !== todayKey &&
          !prayerFetchInProgress &&
          Date.now() - lastPrayerFetchAttempt >= 60000
        ) {
          fetchPrayerTimes();
        }

        // لا نشغّل أوقاتًا قديمة إذا لم تصل بيانات اليوم الحالي بعد.
        if (!prayerTimes || prayerTimesDate !== todayKey) return;

        const nowSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        for (const prayer in prayerTimes) {
          if (
            nowSeconds >= prayerTimes[prayer] &&
            nowSeconds < prayerTimes[prayer] + 5 &&
            athanPlayedKey !== `${prayer}-${todayKey}` &&
            !athanActive
          ) {
            athanPlayedKey = `${prayer}-${todayKey}`;
            playAthan(prayer);
            break;
          }
        }
      }

      /* ========================================================
         MAIN LOOP
         ======================================================== */
      function mainLoop() {
        const now = new Date();
        updateClock(now);

        const todayKey = getLocalDateKey(now);
        if (todayKey !== lastRenderedDateKey) {
          updateDate(now);
          lastRenderedDateKey = todayKey;
        }

        checkStatusBoxes(now);
        checkAlerts(now);
        checkAthanOnline(now);
        controlNightMode(now);

        if (!athanActive && bgVideo.style.display !== "block") {
          sliderCounter++;
          if (sliderCounter >= 5) {
            nextSlide();
            sliderCounter = 0;
          }
        }
      }

      const startupNow = new Date();
      updateDate(startupNow);
      lastRenderedDateKey = getLocalDateKey(startupNow);
      updateClock(startupNow);
      setInterval(mainLoop, 1000);
      fetchPrayerTimes();

      /* ========================================================
         LOADING SCREEN LOGIC
         ======================================================== */
      function revealUI() {
        document.body.classList.remove("booting");
      }
      // شبكة أمان: لا تبقى الواجهة مخفية إذا تعطّل التحميل لأي سبب
      setTimeout(revealUI, 30000);

      function startPreloading() {
        const loading = document.getElementById("loadingScreen");
        const progressBar = document.getElementById("progressBar");
        const progressText = document.getElementById("progressText");
        const filesToLoad = [];
        const failures = [];
        let completed = 0;
        let finished = false;

        for (let i = 1; i <= 5; i++) {
          filesToLoad.push({ src: `preimg/Slide${i}.JPG`, type: "image" });
        }
        for (let i = 1; i <= 5; i++) {
          filesToLoad.push({ src: `video/P${i}.mp4`, type: "video" });
        }
        for (let i = 0; i <= 13; i++) {
          const key = i < 10 ? `0${i}` : String(i);
          filesToLoad.push({ src: `audio/${key}.MP3`, type: "audio", element: audioFiles[key] });
        }
        athanAudio.preload = "auto";
        filesToLoad.push({ src: "audio/athan.MP3", type: "audio", element: athanAudio });

        const totalFiles = filesToLoad.length;
        progressText.textContent = `٠٪ — ٠ من ${toArabicNumber(totalFiles)} ملف`;

        function finishLoading() {
          if (finished) return;
          finished = true;
          progressBar.style.width = "100%";
          if (failures.length) {
            progressBar.style.background = "#f9a825";
            progressText.textContent = `اكتمل الفحص؛ تعذّر تجهيز ${toArabicNumber(failures.length)} ملفات`;
            console.warn("ملفات لم تجهز أثناء التحميل المسبق:", failures);
          } else {
            progressText.textContent = "اكتمل تجهيز الملفات بنجاح";
          }
          setTimeout(() => {
            loading.style.opacity = "0";
            revealUI();
            setTimeout(() => { loading.style.display = "none"; }, 850);
          }, failures.length ? 1400 : 500);
        }

        function settleAsset(asset, succeeded, reason = "") {
          if (asset.settled) return;
          asset.settled = true;
          clearTimeout(asset.timeoutId);
          completed++;
          if (!succeeded) failures.push(`${asset.src}${reason ? ` (${reason})` : ""}`);
          const percent = Math.floor((completed / totalFiles) * 100);
          progressBar.style.width = `${percent}%`;
          progressText.textContent = `${toArabicNumber(percent)}٪ — ${toArabicNumber(completed)} من ${toArabicNumber(totalFiles)} ملف`;
          if (completed >= totalFiles) finishLoading();
        }

        filesToLoad.forEach((entry) => {
          const asset = { ...entry, settled: false, timeoutId: null };
          asset.timeoutId = setTimeout(() => settleAsset(asset, false, "انتهت مهلة التجهيز"), 18000);

          if (entry.type === "image") {
            const image = new Image();
            image.onload = () => settleAsset(asset, true);
            image.onerror = () => settleAsset(asset, false, "خطأ صورة");
            image.src = entry.src;
            if (image.complete) {
              if (image.naturalWidth > 0) settleAsset(asset, true);
              else settleAsset(asset, false, "صورة غير صالحة");
            }
          } else if (entry.type === "video") {
            const video = document.createElement("video");
            video.preload = "auto";
            video.muted = true;
            video.playsInline = true;
            video.addEventListener("loadeddata", () => settleAsset(asset, true), { once: true });
            video.addEventListener("error", () => settleAsset(asset, false, "خطأ فيديو"), { once: true });
            video.src = entry.src;
            video.load();
          } else {
            // استخدام عناصر الصوت الفعلية للنظام يمنع إنشاء نسخ تحميل إضافية لكل ملف.
            const audio = entry.element || new Audio();
            audio.preload = "auto";
            if (audio.readyState >= 4) {
              settleAsset(asset, true);
              return;
            }
            audio.addEventListener("canplaythrough", () => settleAsset(asset, true), { once: true });
            audio.addEventListener("error", () => settleAsset(asset, false, "خطأ صوت"), { once: true });
            if (audio.src !== new URL(entry.src, document.baseURI).href) audio.src = entry.src;
            audio.load();
          }
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", startPreloading, { once: true });
      } else {
        startPreloading();
      }

    </script>
  </body>
</html>
