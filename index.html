<!doctype html>
<html lang="ar">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Display - Optimized</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Arial;
        background: #000;
        overflow: hidden;
        visibility: hidden;
      }

      /* LOADING */
      #loadingScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-size: 28px;
        z-index: 9000;
        direction: rtl;
        transition: opacity 0.8s ease;
      }
      #progressContainer {
        width: 400px;
        height: 20px;
        background: #333;
        margin-top: 25px;
        border-radius: 10px;
        overflow: hidden;
      }
      #progressBar {
        height: 100%;
        width: 0%;
        background: #00c853;
        transition: width 0.3s;
      }
      #progressText {
        margin-top: 15px;
        font-size: 22px;
      }

      /* VIDEO */
      #bgVideo {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: 2000;
        opacity: 0;
        transition: opacity 1.2s ease;
        display: none;
      }

      /* SLIDER */
      .slider {
        position: fixed;
        width: 100%;
        height: 100%;
        z-index: 1000;
        opacity: 1;
        transition: opacity 1.2s ease;
      }
      .slide {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 1.5s ease-in-out;
      }
      .slide.active {
        opacity: 1;
      }

      /* RV VIDEO INTERSTITIAL */
      #rvVideo {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 3000; /* تحت الأذان والتكبيرات، ولكن فوق السلايدر */
        opacity: 0;
        visibility: hidden;
        transition: opacity 1.5s ease, visibility 0s linear 1.5s;
      }
      #rvVideo.show {
        opacity: 1;
        visibility: visible;
        transition: opacity 1.5s ease, visibility 0s linear 0s;
      }

      /* TAKBERAAT VIDEO */
      #takberaatVideo {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 3500; /* أعلى من RV ولكن تحت الأذان */
        opacity: 0;
        visibility: hidden;
        transition: opacity 1.5s ease, visibility 0s linear 1.5s;
      }
      #takberaatVideo.show {
        opacity: 1;
        visibility: visible;
        transition: opacity 1.5s ease, visibility 0s linear 0s;
      }

      /* LOGO */
      .top-right-logo {
        position: absolute;
        top: 0;
        right: 0;
        width: 11vw; 
        max-width: 839px;
        min-width: 250px;
        height: auto;
        z-index: 5000;
      }

      /* CLOCK */
      .clock {
        position: absolute;
        top: 40px;
        left: 40px;
        width: 240px;
        height: 240px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(6px);
        border: 6px solid rgba(0, 0, 0, 0.75);
        box-shadow:
          0 0 0 6px rgba(255, 255, 255, 0.6),
          0 15px 35px rgba(0, 0, 0, 0.25);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 5000;
      }
      .center {
        position: absolute;
        width: 16px;
        height: 16px;
        background: #000;
        border-radius: 50%;
        z-index: 10;
      }
      .clock-logo {
        position: absolute;
        width: 50px;
        z-index: 2;
        top: 30%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .hand {
        position: absolute;
        bottom: 50%;
        transform-origin: bottom;
        border-radius: 10px;
        z-index: 5;
      }
      .hour {
        width: 7px;
        height: 65px;
        background: #111;
      }
      .minute {
        width: 4px;
        height: 95px;
        background: #333;
      }
      .second {
        width: 2px;
        height: 105px;
        background: #d40000;
      }
      .number {
        position: absolute;
        font-size: 22px;
        font-weight: 500;
        color: #111;
        transform: translate(-50%, -50%);
        z-index: 6;
      }
      .number.bold {
        font-weight: 800;
        font-size: 29px;
      }
      .tick {
        position: absolute;
        width: 3px;
        height: 7px;
        background: #222;
        top: 5px;
        left: 49%;
        transform-origin: 50% 110px;
      }
      .tick.small {
        height: 3px;
        width: 2px;
        background: #555;
      }

      /* STATUS CONTAINER */
      .status-container {
        position: absolute;
        bottom: 40px;
        right: 40px;
        display: flex;
        gap: 20px;
        z-index: 5000;
        direction: rtl;
      }

      .status {
        background: rgba(255, 255, 255, 0.95);
        padding: 18px 25px;
        border-radius: 15px;
        font-size: 20px;
        font-weight: bold;
        text-align: center;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        display: none;
        width: 260px;
      }

      .status-title {
        font-size: 16px;
        margin-bottom: 8px;
        border-bottom: 2px solid #eee;
        padding-bottom: 6px;
        font-weight: 900;
      }

      .status-time {
        margin-top: 12px;
        font-size: 16px;
        font-weight: bold;
        text-align: center;
      }

      .time-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        direction: rtl;
      }

      .progress-container-small {
        flex: 1;
        height: 8px;
        background: #ddd;
        border-radius: 10px;
        overflow: hidden;
      }

      .progress-bar-small {
        height: 100%;
        width: 0%;
        background: #00c853;
        transition: width 1s linear, background 0.3s;
      }

      .progress-bar-small.ending {
        background: #f34141;
        animation: pulseBar 1s infinite;
      }

      @keyframes pulseBar {
        0% { opacity: 1; }
        50% { opacity: 0.6; }
        100% { opacity: 1; }
      }

      .remaining-time {
        margin-top: 8px;
        font-size: 17px;
        color: #000000;
        font-weight: bold;
      }

      .time-text {
        font-size: 17px;
        font-weight: bold;
      }

      /* DATE */
      .date-box {
        position: absolute;
        bottom: 40px;
        left: 40px;
        background: rgba(255, 255, 255, 0.95);
        padding: 18px 30px;
        border-radius: 15px;
        font-size: 20px;
        font-weight: bold;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        direction: rtl;
        z-index: 5000;
      }

      /* OVERLAY */
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.75);
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
        font-size: 44px;
        font-weight: bold;
        line-height: 1.8;
        text-align: center;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.6s ease, visibility 0s linear 0.6s;
        z-index: 6000;
        direction: rtl;
        padding: 40px;
      }
      .overlay.show {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.6s ease, visibility 0s linear 0s;
      }

      /* ATHAN VIDEO */
      #athanVideo {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 4000;
        opacity: 0;
        visibility: hidden;
        transition: opacity 1.5s ease, visibility 0s linear 1.5s;
      }
      #athanVideo.show {
        opacity: 1;
        visibility: visible;
        transition: opacity 1.5s ease, visibility 0s linear 0s;
      }

      #athanWhiteFade {
        position: fixed;
        inset: 0;
        background: white;
        opacity: 0;
        pointer-events: none;
        z-index: 9998;
        transition: opacity 2.5s ease;
      }
    </style>
  </head>

      // Clock Elements
      const hourEl = document.querySelector(".hour");
      const minuteEl = document.querySelector(".minute");
      const secondEl = document.querySelector(".second");
      const clockEl = document.querySelector(".clock");

      /* Draw Clock Face */
      const nums = ["١", "٢", "٣", "٤", "٥", "٦", "٧", "٨", "٩", "١٠", "١١", "١٢"];
      for (let i = 1; i <= 12; i++) {
        let n = document.createElement("div");
        n.className = "number";
        if ([3, 6, 9, 12].includes(i)) n.classList.add("bold");
        n.textContent = nums[i - 1];
        let angle = (i * 30 * Math.PI) / 180;
        let r = 87;
        n.style.left = 113 + r * Math.sin(angle) + "px";
        n.style.top = 116 - r * Math.cos(angle) + "px";
        clockEl.appendChild(n);
      }
      for (let i = 0; i < 60; i++) {
        let t = document.createElement("div");
        t.className = "tick" + (i % 5 ? " small" : "");
        t.style.transform = `rotate(${i * 6}deg)`;
        clockEl.appendChild(t);
      }

      /* ========================================================
         NEW SLIDER & MEDIA LOGIC
         ======================================================== */
      const totalImages = 300;
      let currentIndex = 1; 
      
      let currentRIndex = 1; 
      let currentRVIndex = 0; 
      let normalSlideStreak = 1; 
      let rImageStreak = 0; 
      
      let slideTimer = 0; 
      let currentSlideDuration = 5; 
      let isRVVideoPlaying = false; 

      let img1 = document.createElement("img");
      let img2 = document.createElement("img");
      img1.className = "slide active";
      img2.className = "slide";
      slider.appendChild(img1);
      slider.appendChild(img2);

      img1.src = `preimg/Slide${currentIndex}.JPG`;

      function padZero(num) {
          return num < 10 ? "0" + num : num.toString();
      }

      function transitionToImage(src) {
        img2.src = src;
        img2.onload = () => {
          img2.classList.add("active");
          img1.classList.remove("active");
          [img1, img2] = [img2, img1];
        };
      }

      function advancePresentation() {
          if (normalSlideStreak >= 10) {
              if (rImageStreak >= 7) {
                  showRVVideo();
                  rImageStreak = 0; 
                  normalSlideStreak = 0; 
              } else {
                  let rSrc = `preimg/R/R-${padZero(currentRIndex)}.jpg`;
                  transitionToImage(rSrc);
                  currentSlideDuration = 11; 
                  
                  currentRIndex++;
                  if (currentRIndex > 26) currentRIndex = 1;
                  
                  rImageStreak++;
                  normalSlideStreak = 0; 
              }
          } else {
              currentIndex++;
              if (currentIndex > totalImages) currentIndex = 1;
              let normalSrc = `preimg/Slide${currentIndex}.JPG`;
              transitionToImage(normalSrc);
              currentSlideDuration = 5; 
              
              normalSlideStreak++;
          }
      }

      function showRVVideo() {
          isRVVideoPlaying = true;
          
          let rvSrc = `video/RV/RV-0${currentRVIndex + 1}.mp4`; 
          rvVideo.src = rvSrc;
          
          rvVideo.onloadeddata = () => {
              rvVideo.classList.add("show");
              rvVideo.play().catch(e => console.log("خطأ تشغيل فيديو RV:", e));
          };
          
          rvVideo.onended = endRVVideo;
          
          let fallbackDuration = (currentRVIndex === 0) ? 40 : 22; 
          setTimeout(() => {
              if (isRVVideoPlaying) endRVVideo();
          }, (fallbackDuration * 1000) + 1000); 
      }

      function endRVVideo() {
          if (!isRVVideoPlaying) return;
          isRVVideoPlaying = false;
          rvVideo.classList.remove("show");
          
          setTimeout(() => {
              rvVideo.pause();
              rvVideo.src = "";
          }, 1500); 
          
          currentRVIndex++;
          if (currentRVIndex > 1) currentRVIndex = 0;
          
          slideTimer = 0;

        { time: "09:30", advance: 0, duration: 15, audio: "07", text: "انتهت الحصة الرابعة<br>🟠 وتبدأ الآن الفسحة الثانية للصفوف الأولية<br>🟡 والحصة الخامسة للصفوف العليا" },
        { time: "09:45", advance: 0, duration: 12, audio: "08", text: "🟠 انتهت الفسحة الثانية للصفوف الأولية، وتبدأ الآن الحصة الخامسة" },
        { time: "10:05", advance: 0, duration: 12, audio: "09", text: "🟡 انتهت الحصة الخامسة للصفوف العليا، وتبدأ الآن الفسحة الثانية" },
        { time: "10:20", advance: 0, duration: 12, audio: "10", text: "🟠 تبدأ الآن الحصة السادسة 🟡" },
        { time: "10:50", advance: 0, duration: 12, audio: "11", text: "🟠 انتهت الحصة السادسة، وتبدأ الآن الحصة السابعة 🟡" },
        { time: "11:20", advance: 0, duration: 10, audio: "12", text: "🟠 الآن خروج الصفوف الأولية" },
        { time: "11:25", advance: 0, duration: 10, audio: "13", text: "🟡 الآن خروج الصفوف العليا" }
      ];


      /* HELPERS */
      function toMin(t) {
        let [a, b] = t.split(":").map(Number);
        return a * 60 + b;
      }
      function toArabicDigits(s) {
        return s.replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
      }
      function toArabicNumber(num) {
        return num.toString().replace(/\d/g, (d) => "٠١٢٣٤٥٦٧٨٩"[d]);
      }
      function formatTimeWithoutLeadingZero(timeStr) {
        let [h, m] = timeStr.split(":");
        h = parseInt(h, 10);
        return h + ":" + m;
      }
      function formatRemainingMinutes(n) {
        if (n === 1) return "متبقي دقيقة";
        if (n === 2) return "متبقي دقيقتان";
        if (n >= 3 && n <= 10) return `متبقي ${toArabicNumber(n)} دقائق`;
        return `متبقي ${toArabicNumber(n)} دقيقة`;
      }

      /* ========================================================
         STATE VARIABLES & TAKBERAAT SYSTEM
         ======================================================== */
      let lastTriggeredAlertId = "";
      let alertTimeout = null;
      let athanActive = false;
      let athanPlayedKey = null;
      let lastFetchDate = null;
      let prayerTimes = null;

      const PRAYER_VIDEOS = {
        Fajr: "video/P1.mp4",
        Dhuhr: "video/P2.mp4",
        Asr: "video/P3.mp4",
        Maghrib: "video/P4.mp4",
        Isha: "video/P5.mp4",
      };

      // متغيرات التكبيرات وقت الفسحة
      let isTakberaatPlaying = false;
      let takberaatFullyEndedForThisRecess = false; 
      let recessAlertEndTime = null;
      let currentRecessId = null;

      const takberaatVideo = document.getElementById("takberaatVideo");
      const takberaatAudio = document.getElementById("takberaatAudio");

      // تشغيل التكبيرات
      function startTakberaat() {
          if (athanActive) return; 
          isTakberaatPlaying = true;
          
          if (isRVVideoPlaying) {
              endRVVideo(); // إيقاف إعلان RV إذا كان يعمل
          }

          takberaatVideo.loop = true; 
          takberaatAudio.loop = true; 
          takberaatAudio.currentTime = 0;
          takberaatVideo.currentTime = 0;

          takberaatVideo.classList.add("show");
          takberaatVideo.play().catch(e => console.log(e));
          takberaatAudio.play().catch(e => console.log(e));
      }

      // حدث انتهاء ملف الصوت (يعمل فقط عندما يتم إلغاء الـ loop)
      takberaatAudio.onended = function() {
          if (!takberaatAudio.loop && isTakberaatPlaying) {
              endTakberaatFadeOut();
          }
      };

      // التوقف التدريجي للتكبيرات
      function endTakberaatFadeOut() {
          takberaatVideo.classList.remove("show"); // تفعيل Fade Out
          takberaatFullyEndedForThisRecess = true;
          
          setTimeout(() => {
              takberaatVideo.pause();
              isTakberaatPlaying = false; // يتيح للسلايدر الاستئناف
          }, 1500); 
      }

      // الإيقاف الإجباري (يُستخدم إذا دخل وقت الأذان أو تغير الوقت فجأة)
      function forceStopTakberaat() {
          isTakberaatPlaying = false;
          takberaatVideo.classList.remove("show");
          takberaatAudio.pause();
          setTimeout(() => {
              takberaatVideo.pause();
          }, 1500);
      }

      // دالة لجلب الفسحة النشطة حالياً (إن وجدت)
      function getActiveRecess(now) {
          let currentMinutes = now.getHours() * 60 + now.getMinutes();
          let today = now.getDay();
          let isWedThu = (today === 3 || today === 4);
          let pSched = isWedThu ? schedPrimaryWedThu : schedPrimaryReg;
          let uSched = isWedThu ? schedUpperWedThu : schedUpperReg;

          let pCurrent = pSched.find((e) => currentMinutes >= toMin(e.start) && currentMinutes < toMin(e.end));
          let uCurrent = uSched.find((e) => currentMinutes >= toMin(e.start) && currentMinutes < toMin(e.end));

          if (pCurrent && pCurrent.name.includes("الفسحة")) return pCurrent;
          if (uCurrent && uCurrent.name.includes("الفسحة")) return uCurrent;
          return null;
      }

      /* ========================================================
         CORE FUNCTIONS
         ======================================================== */

      function updateClock(d) {
        hourEl.style.transform = `rotate(${(d.getHours() % 12) * 30 + d.getMinutes() * 0.5}deg)`;
        minuteEl.style.transform = `rotate(${d.getMinutes() * 6}deg)`;
        secondEl.style.transform = `rotate(${d.getSeconds() * 6}deg)`;
      }

      function updateDate(d) {
        let days = ["الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];
        
        let hijriAdjustment = new Date(d.getTime());
        hijriAdjustment.setDate(hijriAdjustment.getDate() - 1); 

        let hijri = new Intl.DateTimeFormat("ar-SA-u-ca-islamic", {
          day: "numeric", month: "long", year: "numeric",
        }).format(hijriAdjustment);
        hijri = hijri.replace(/\s?هـ/, "").trim() + "هـ";
        
        let greg = new Intl.DateTimeFormat("ar-EG", {
          day: "numeric", month: "long", year: "numeric",
        }).format(d);
        
        dateBox.innerHTML = `
          <div>${days[d.getDay()]} ${toArabicDigits(hijri)}</div>
          <div style="margin-top:8px;">الموافق ${toArabicDigits(greg)}م</div>
        `;
      }

      function renderStatusBox(boxElement, eventData, title, titleColor, icon, currentMinutes) {
        if (eventData) {
          boxElement.style.display = "block";
          
          if (eventData.name === "الخروج") {
            boxElement.innerHTML = `
              <div class="status-title" style="color: ${titleColor};">${title}</div>
              <div style="margin-top: 15px; font-size: 22px; font-weight: bold;">${icon} الآن ${eventData.name}</div>
            `;
            return;
          }

          const startMin = toMin(eventData.start);
          const endMin = toMin(eventData.end);
          const totalDuration = endMin - startMin;
          const elapsed = currentMinutes - startMin;
          const remaining = endMin - currentMinutes;
          
          const percent = Math.min((elapsed / totalDuration) * 100, 100);
          const isEndingSoon = remaining <= 5;

          boxElement.innerHTML = `
            <div class="status-title" style="color: ${titleColor};">${title}</div>
            <div>${icon} الآن ${eventData.name}</div>
            <div class="status-time">
              <div class="time-row">
                <span class="time-text">${toArabicNumber(formatTimeWithoutLeadingZero(eventData.start))}</span>
                <div class="progress-container-small">
                  <div class="progress-bar-small ${isEndingSoon ? "ending" : ""}" style="width:${percent}%"></div>
                </div>
                <span class="time-text">${toArabicNumber(formatTimeWithoutLeadingZero(eventData.end))}</span>
              </div>
              <div class="remaining-time">${formatRemainingMinutes(remaining)}</div>
            </div>
          `;
        } else {
          boxElement.style.display = "none";
        }
      }

      function checkStatusBoxes(now) {
        let currentMinutes = now.getHours() * 60 + now.getMinutes();
        let today = now.getDay();
        
        let isWedThu = (today === 3 || today === 4);
        let currentPrimarySched = isWedThu ? schedPrimaryWedThu : schedPrimaryReg;
        let currentUpperSched = isWedThu ? schedUpperWedThu : schedUpperReg;

        let currentPrimary = currentPrimarySched.find((e) => currentMinutes >= toMin(e.start) && currentMinutes < toMin(e.end));
        let currentUpper = currentUpperSched.find((e) => currentMinutes >= toMin(e.start) && currentMinutes < toMin(e.end));

        renderStatusBox(statusBoxPrimary, currentPrimary, "الصفوف الأولية", "#5d0413", "🟠", currentMinutes);
        renderStatusBox(statusBoxUpper, currentUpper, "الصفوف العليا", "#d04931", "🟡", currentMinutes);
      }

      function checkAlerts(now) {
        if (athanActive) return;
        
        let today = now.getDay();
        let blocked = [5, 6];
        if (blocked.includes(today)) return;

        let isWedThu = (today === 3 || today === 4);
        let activeAlerts = isWedThu ? alertsWedThu : alertsSunTue;
        
        let nowSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

        activeAlerts.forEach((alert, index) => {
            let targetSec = toMin(alert.time) * 60;
            let triggerSec = targetSec - alert.advance;

            if (nowSeconds >= triggerSec && nowSeconds < triggerSec + 2) {
                let alertId = (isWedThu ? "wt" : "st") + "-" + index;
                if (lastTriggeredAlertId !== alertId) {
                    lastTriggeredAlertId = alertId;
                    showOverlayAlert(alert);
                }
            }
        });
      }

      function showOverlayAlert(alert) {
          overlay.innerHTML = `<div>${alert.text}</div>`;
          overlay.classList.add("show");

          const sound = audioFiles[alert.audio];
          if (sound) { 
              sound.currentTime = 0; 
              sound.play().catch(() => {}); 
          }

          // إذا كان التنبيه يخص الفسحة، نحدد موعد انتهاء التنبيه لتشغيل التكبيرات فوراً بعده
          if (alert.text.includes("الفسحة")) {
              recessAlertEndTime = Date.now() + (alert.duration * 1000) + 500; // إضافة 500ms لضمان سلاسة الانتقال
          }

          if (alertTimeout) clearTimeout(alertTimeout);
          alertTimeout = setTimeout(() => {
              overlay.classList.remove("show");
          }, alert.duration * 1000);
      }

      function controlNightMode(now) {
        if (!ENABLE_NIGHT_MODE) return; 
        
        if (athanActive) return;
        const minutes = now.getHours() * 60 + now.getMinutes();
        const start = 21 * 60 + 20; 
        const end = 24 * 60;        

        if (minutes >= start && minutes < end) {
          if (bgVideo.style.display !== "block") {
             bgVideo.style.display = "block";
             bgVideo.style.opacity = "1";
             bgVideo.play().catch(() => {});
             slider.style.opacity = "0";
             setTimeout(() => { slider.style.display = "none"; }, 1200);
          }
        } else {
          if (bgVideo.style.display !== "none") {
             bgVideo.style.opacity = "0";
             bgVideo.pause();
             bgVideo.style.display = "none";
             slider.style.display = "block";
             setTimeout(() => { slider.style.opacity = "1"; }, 100);
          }
        }
      }

      /* ========================================================
         ATHAN SYSTEM
         ======================================================== */
      async function fetchPrayerTimes() {
        try {
          const today = new Date();
          const day = today.getDate();
          const month = today.getMonth() + 1;
          const year = today.getFullYear();
          const response = await fetch(
            `https://api.aladhan.com/v1/timings/${day}-${month}-${year}?latitude=25.9047&longitude=45.3566&method=4`,
          );
          const data = await response.json();
          const timings = data.data.timings;

          function timeToSeconds(t) {
            const [h, m] = t.split(":").map(Number);
            return h * 3600 + m * 60;
          }

          prayerTimes = {
            Fajr: timeToSeconds(timings.Fajr),
            Dhuhr: timeToSeconds(timings.Dhuhr),
            Asr: timeToSeconds(timings.Asr),
            Maghrib: timeToSeconds(timings.Maghrib),
            Isha: timeToSeconds(timings.Isha),
          };
          lastFetchDate = today.toDateString();
        } catch (error) {
          console.error("فشل جلب أوقات الصلاة:", error);
        }
      }

      function playAthan(prayerName) {
        athanActive = true;
        Object.values(audioFiles).forEach((a) => {
          a.pause(); a.currentTime = 0;
        });

        overlay.classList.remove("show");
        bgVideo.pause();
        
        slider.style.opacity = "0";
        
        if (isRVVideoPlaying) {
            rvVideo.pause();
            rvVideo.classList.remove("show");
            isRVVideoPlaying = false;
            currentRVIndex++;
            if (currentRVIndex > 1) currentRVIndex = 0;
            slideTimer = 0;
            normalSlideStreak = 1;
        }

        // إيقاف التكبيرات إجبارياً إذا دخل وقت الأذان
        if (isTakberaatPlaying) {
            forceStopTakberaat();
        }

        athanVideo.src = PRAYER_VIDEOS[prayerName];

        athanVideo.onloadeddata = () => {
          athanVideo.classList.add("show");
          athanVideo.play().catch(() => {});
          athanAudio.currentTime = 0;
          athanAudio.play().catch(() => {});
        };
      }

      athanVideo.onended = function () {
        athanVideo.classList.remove("show"); 
        slider.style.opacity = "1";

        setTimeout(() => {
          athanVideo.pause();
          athanActive = false;
        }, 1500); 
      };

      function checkAthanOnline(now) {
        const todayKey = now.toDateString();
        if (lastFetchDate !== todayKey) fetchPrayerTimes();
        if (!prayerTimes) return;

        const nowSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        for (const prayer in prayerTimes) {
          if (
            nowSeconds >= prayerTimes[prayer] &&
            nowSeconds < prayerTimes[prayer] + 5 &&
            athanPlayedKey !== prayer + todayKey &&
            !athanActive
          ) {
            athanPlayedKey = prayer + todayKey;
            playAthan(prayer);
          }
        }
      }

      /* ========================================================
         MAIN LOOP
         ======================================================== */
      function mainLoop() {
        const now = new Date();
        const currentSeconds = now.getSeconds();

        updateClock(now);
        checkStatusBoxes(now);
        checkAlerts(now);
        checkAthanOnline(now);
        controlNightMode(now);

        if (currentSeconds === 0) {
          updateDate(now);
        }

        // --- TAKBERAAT (RECESS) SYSTEM LOGIC ---
        let activeRecess = getActiveRecess(now);

        if (activeRecess) {
            let recessId = activeRecess.name + activeRecess.start;
            if (currentRecessId !== recessId) {
                // إذا بدأنا في فسحة جديدة
                currentRecessId = recessId;
                takberaatFullyEndedForThisRecess = false;
                recessAlertEndTime = null; 
            }

            let recessEndSeconds = toMin(activeRecess.end) * 60;
            let currentSecondsFromMidnight = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
            let remainingSeconds = recessEndSeconds - currentSecondsFromMidnight;

            // شرط التشغيل: مسموح بالتشغيل، ولم ينتهِ لهذه الفسحة، وإما لا يوجد تنبيه يمنع أو انقضى وقته
            if (!isTakberaatPlaying && !takberaatFullyEndedForThisRecess) {
                if (!recessAlertEndTime || Date.now() >= recessAlertEndTime) {
                    startTakberaat();
                }
            }

            // شرط الإيقاف الذكي (قبل النهاية بـ 110 ثانية)
            if (isTakberaatPlaying) {
                if (remainingSeconds <= 110) {
                    takberaatAudio.loop = false; // نوقف التكرار ليأخذ الصوت مساره الطبيعي للإغلاق
                }
            }
        } else {
            // لسنا في وقت الفسحة الآن، نقوم بتهيئة القيم للفسحة القادمة
            if (currentRecessId) {
                currentRecessId = null;
                takberaatFullyEndedForThisRecess = false;
                recessAlertEndTime = null;
                if (isTakberaatPlaying) {
                    forceStopTakberaat();
                }
            }
        }
        // ---------------------------------------

        // نظام المؤقت الذي يدير السلايدر والصور وفيديوهات RV
        // السلايدر يتوقف تماماً (ولا يزيد عداده) إذا كانت التكبيرات تعمل
        if (!athanActive && bgVideo.style.display !== "block" && !isRVVideoPlaying && !isTakberaatPlaying) {
            slideTimer++;
            if (slideTimer >= currentSlideDuration) {
                slideTimer = 0;
                advancePresentation();
            }
        }
      }

      fetchPrayerTimes();
      updateDate(new Date()); 
      setInterval(mainLoop, 1000);

      /* ========================================================
         LOADING SCREEN LOGIC
         ======================================================== */
      window.addEventListener("load", () => {
        document.body.style.visibility = "visible";
        bgVideo.play().catch(() => {});

        const loading = document.getElementById("loadingScreen");
        const progressBar = document.getElementById("progressBar");
        const progressText = document.getElementById("progressText");

        const firstImagesCount = 5;
        let filesToLoad = [];
        let loaded = 0;

        for (let i = 1; i <= firstImagesCount; i++) {
          filesToLoad.push(`preimg/Slide${i}.JPG`);
        }
        
        filesToLoad.push("preimg/R/R-01.jpg", "video/RV/RV-01.mp4");
        
        // --- إضافة ملفات الفسحة الجديدة (التكبيرات) للتحميل المسبق ---
        filesToLoad.push("video/T/tkaberaat.mp4", "audio/takberaat.MP3");
        
        filesToLoad.push("video/P1.mp4", "video/P2.mp4", "video/P3.mp4", "video/P4.mp4", "video/P5.mp4");
        
        for(let i=0; i<=13; i++) {
            let key = i < 10 ? "0" + i : i.toString();
            filesToLoad.push(`audio/${key}.MP3`);
        }
        filesToLoad.push("audio/athan.MP3");

        const totalFiles = filesToLoad.length;

        function updateProgress() {
          loaded++;
          const percent = Math.floor((loaded / totalFiles) * 100);
          progressBar.style.width = percent + "%";
          progressText.textContent = percent + "%";

          if (loaded >= totalFiles) {
            setTimeout(() => {
              loading.style.opacity = "0";
              setTimeout(() => { loading.style.display = "none"; }, 800);
            }, 400);
          }
        }

        filesToLoad.forEach((src) => {
          if (src.includes("preimg")) {
            const img = new Image();
            img.src = src;
            img.onload = updateProgress;
            img.onerror = updateProgress;
          } else {
            const audio = new Audio();
            audio.src = src;
            audio.preload = "auto";
            audio.oncanplaythrough = updateProgress;
            audio.onerror = updateProgress; 
          }
        });
      });
    </script>
  </body>
</html>
